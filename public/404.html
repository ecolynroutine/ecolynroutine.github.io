<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ECOLYN</title>
    <script>
      var path = location.pathname.replace(/\/+$/, '');
      var pack = /\/pack$/.test(path);
      if (pack) location.replace(path + '/');
      else location.replace(location.pathname.split('/').slice(0, -1).join('/') + '/');
    </script>
  </head>
  <body></body>
</html>
